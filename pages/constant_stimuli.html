<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constant Stimuli</title>
    <link rel="stylesheet" href="../stylesheets/constant_style.css">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="../scripts/constant_script.js" defer></script>
</head>

<body>
    <h1>Constant Stimuli Method</h1>

    <section class="lab">

        <div class="panel">

            <h1 class="panel-header">Test</h1>

            <div class="panel-body">

                <div class="int-holder">

                    <div class="current-holder">
                        <p id="currentIntHolder"><input id="currentInt" value="5">dB HL</p>
                        <p>Threshold</p>
                    </div>
                    <button id="presentBtn">Present</button>
                    <button id="resetBtn">Reset</button>
                    <label for="presentTimes">Number of presentations for each sample</label>
                    <input id="presentTimes" type="number" value="5">
                    <p>Samples</p>
                    <div class="present-samples-holder">
                        <p class="sample"><input id="slm1" type="number" class="sample-input" value="0">dB</p>
                        <p class="sample"><input id="slm2" type="number" class="sample-input" value="2">dB</p>
                        <p class="sample"><input id="slm3" type="number" class="sample-input" value="4">dB</p>
                        <p class="sample"><input id="slm4" type="number" class="sample-input" value="6">dB</p>
                        <p class="sample"><input id="slm5" type="number" class="sample-input" value="8">dB</p>
                        <p class="sample"><input id="slm6" type="number" class="sample-input" value="10">dB</p>
                        <p class="sample"><input id="slm7" type="number" class="sample-input" value="12">dB</p>
                        <p class="sample"><input id="slm8" type="number" class="sample-input" value="14">dB</p>
                    </div>
                </div>


            </div>
        </div>


        <div class="panel">

            <h1 class="panel-header">Result</h1>

            <div class="panel-body">
                <div class="result-grid">
                    <p class="clmn-a" id="slm1Grid">0</p>
                    <p class="clmn-a" id="slm2Grid">2</p>
                    <p class="clmn-a" id="slm3Grid">4</p>
                    <p class="clmn-a" id="slm4Grid">6</p>
                    <p class="clmn-a" id="slm5Grid">8</p>
                    <p class="clmn-a" id="slm6Grid">10</p>
                    <p class="clmn-a" id="slm7Grid">12</p>
                    <p class="clmn-b" id="slm8Grid">14</p>

                    <p class="clmn-a"><span id="slm1Result">N</span>/<span class="resultPresentTimes">5</span></p>
                    <p class="clmn-a"><span id="slm2Result">N</span>/<span class="resultPresentTimes">5</span></p>
                    <p class="clmn-a"><span id="slm3Result">N</span>/<span class="resultPresentTimes">5</span></p>
                    <p class="clmn-a"><span id="slm4Result">N</span>/<span class="resultPresentTimes">5</span></p>
                    <p class="clmn-a"><span id="slm5Result">N</span>/<span class="resultPresentTimes">5</span></p>
                    <p class="clmn-a"><span id="slm6Result">N</span>/<span class="resultPresentTimes">5</span></p>
                    <p class="clmn-a"><span id="slm7Result">N</span>/<span class="resultPresentTimes">5</span></p>
                    <p class="clmn-b"><span id="slm8Result">N</span>/<span class="resultPresentTimes">5</span></p>
                </div>

                <div id="plot"></div>

            </div>
        </div>

    </section>
</body>

</html>
